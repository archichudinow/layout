<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%232563eb'/%3E%3Cpath d='M12 38c5-6 11-6 16 0s11 6 16 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 48c5-6 11-6 16 0s11 6 16 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' opacity='.6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f2f3f4; --panel:#fbfbfc; --bd:#e3e4e7; --tx:#3f434a; --sub:#8b9099;
    --acc:#5c6470; --acc-soft:#e9eaed; --shadow:0 2px 10px rgba(20,22,26,.06);
    --dotgrid:#e2e3e6; --hover:#ececef; --cell:#f7f7f9; --cellbusy:#f0f1f2; --freetx:#6a707b;
  }
  [data-theme="dark"]{
    --bg:#17191d; --panel:#1d2025; --bd:#282c33; --tx:#b9bec6; --sub:#767d88;
    --acc:#8b939f; --acc-soft:#262a31; --shadow:0 2px 10px rgba(0,0,0,.3);
    --dotgrid:#1f2227; --hover:#252930; --cell:#212429; --cellbusy:#1b1e23; --freetx:#8b939f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--tx);background:var(--bg);-webkit-user-select:none;user-select:none;touch-action:none}
  #canvas{display:block;position:fixed;inset:0;background:
    radial-gradient(circle, var(--dotgrid) 1px, transparent 1px) 0 0/22px 22px, var(--bg);cursor:default}

  .bar{position:fixed;z-index:10;display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow);padding:6px}
  #tools{top:14px;left:50%;transform:translateX(-50%)}
  #left{top:14px;left:14px;gap:10px;padding:8px 12px;font-size:13px}
  #right{top:14px;right:14px}
  .btn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    height:34px;min-width:34px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--tx);white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.on{background:var(--acc-soft);color:var(--acc)}
  .btn.primary{background:var(--acc);color:var(--panel)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn svg{width:18px;height:18px;pointer-events:none}
  .sep{width:1px;height:24px;background:var(--bd);margin:0 2px}
  input[type=color]{width:30px;height:30px;border:none;background:none;padding:0;cursor:pointer;border-radius:8px}
  input[type=range]{width:88px}
  input[type=text]{border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:14px}
  .dot{width:9px;height:9px;border-radius:50%;background:#c7ccd4;flex:none}
  .dot.live{background:#7fae8e;box-shadow:0 0 0 3px rgba(127,174,142,.15)}
  #status{font-size:12px;color:var(--sub)}
  #name{font-weight:600}
  .chip{display:none;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:8px;
    background:var(--acc-soft);color:var(--acc);font-size:13px;font-weight:600;cursor:pointer}
  .chip .sw{width:10px;height:10px;border-radius:3px}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;font-size:12px;color:var(--sub);
    background:var(--panel);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow)}
  #peers{position:fixed;bottom:12px;right:12px;z-index:10;font-size:12px;color:var(--sub);
    background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);max-width:250px;display:none}
  #peers b{color:var(--tx)}
  #peers .pw{display:flex;align-items:center;gap:7px;margin-top:5px}
  #peers .sw{width:10px;height:10px;border-radius:3px;flex:none}
  #peers .me{font-weight:600;color:var(--tx)}

  .overlay{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.35);display:none;align-items:center;justify-content:center}
  .modal{background:var(--panel);border:1px solid var(--bd);border-radius:16px;box-shadow:0 20px 60px rgba(16,24,40,.25);
    width:min(94vw,470px);max-height:84vh;overflow:auto;padding:22px}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal p{margin:0 0 16px;color:var(--sub);font-size:13px}
  .modal .row{display:flex;gap:8px}
  .modal input[type=text]{flex:1}
  .mnote{color:var(--sub);font-size:12px;margin:10px 0 0}
  #folderpick{text-align:center}
  body.nojoin #tools,body.nojoin #left,body.nojoin #right,body.nojoin #peers{display:none}
  .linkbtn{all:unset;cursor:pointer;color:var(--acc);font-weight:600}
  .linkbtn:hover{text-decoration:underline}
  #setuppool{font-size:12px;color:var(--sub);font-weight:500}
  #setuppool:hover{color:var(--acc)}
  #pickfolder{box-sizing:border-box;box-shadow:0 2px 8px rgba(20,22,26,.15)}
  #pickfolder:active{transform:translateY(1px)}
  #mclose:hover{color:var(--tx)}
  #modalfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--sub);
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  #folderName{color:var(--tx)}
  .slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slotcell{all:unset;border:1px solid var(--bd);border-radius:10px;padding:8px 9px;cursor:pointer;background:var(--cell);
    min-height:54px;display:flex;flex-direction:column;gap:3px;box-sizing:border-box}
  .slotcell:hover{border-color:var(--acc)}
  .slotcell .n{font-size:11px;color:var(--sub)}
  .slotcell .who{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slotcell .sw{width:9px;height:9px;border-radius:3px;flex:none}
  .slotcell.busy{opacity:.6;cursor:not-allowed;background:var(--cellbusy)}
  .slotcell.you{border-color:var(--acc);background:var(--acc-soft)}
  .slotcell.free .who{color:var(--freetx)}
</style>
</head>
<body class="nojoin">
<canvas id="canvas"></canvas>

<div class="bar" id="left">
  <svg id="poolicon" viewBox="0 0 64 64" style="width:18px;height:18px;flex:none"><rect x="4" y="4" width="56" height="56" rx="14" fill="#2563eb"/><path d="M12 38c5-6 11-6 16 0s11 6 16 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M12 48c5-6 11-6 16 0s11 6 16 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/></svg>
  <span id="proj" style="font-weight:700;letter-spacing:.02em;text-transform:uppercase;display:none"></span>
  <span class="dot" id="syncdot"></span>
  <span id="name">—</span>
  <span id="status">not joined</span>
</div>

<div class="bar" id="tools">
  <button class="btn on" data-tool="select" title="Select / move (V)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7.5 18 2.6-7.9L21 10.5z"/></svg>
  </button>
  <button class="btn" data-tool="pen" title="Draw (P)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  </button>
  <button class="btn" data-tool="note" title="Sticky note (N)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9l7-7V5a2 2 0 0 0-2-2z"/><path d="M14 21v-5a2 2 0 0 1 2-2h5"/></svg>
  </button>
  <button class="btn" data-tool="pan" title="Pan (hold Space)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0-2-2 2 2 0 0 0-2 2v0a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M14 10V4a2 2 0 0 1 4 0v6"/><path d="M6 14c-1.5-2-3-2.5-3-4a2 2 0 0 1 4 0"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-7-4l-2.5-4"/></svg>
  </button>
  <span class="sep"></span>
  <input type="color" id="color" value="#111827" title="Colour">
  <input type="range" id="width" min="1" max="24" value="3" title="Brush size">
  <span class="sep"></span>
  <button class="btn" id="addImg" title="Add image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5L9 20"/></svg>
    Image
  </button>
  <button class="btn" id="dup" title="Copy selected — also works on other people's items (Ctrl+D)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>
  <button class="btn" id="del" title="Delete selected (Del)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
  </button>
  <button class="btn" id="undo" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
  </button>
  <button class="btn" id="fit" title="Fit to content">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m0 8v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3m0-8V5a2 2 0 0 0-2-2h-3"/></svg>
  </button>
</div>

<div class="bar" id="right">
  <span class="chip" id="chanchip" title="Your seat — click to switch"><span class="sw"></span><span id="channame"></span></span>
  <button class="btn" id="homebtn" title="Boards — choose project folder">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button class="btn" id="themebtn" title="Dark / light mode"></button>
</div>

<div id="peers"></div>
<div id="dbg" style="position:fixed;left:14px;bottom:12px;z-index:10;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--sub);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;box-shadow:var(--shadow);display:none"></div>

<div class="overlay" id="overlay">
  <div class="modal" style="position:relative">
    <button id="mclose" title="Close" style="position:absolute;top:8px;right:10px;background:none;border:0;font-size:22px;line-height:1;color:var(--sub);cursor:pointer;display:none">&times;</button>
    <h2 id="mtitle">Join the board</h2>
    <p id="mdesc">Select your project folder to begin.</p>
    <div id="folderpick" style="display:none">
      <button class="btn primary" id="pickfolder" style="justify-content:center;width:100%;height:44px;font-size:14px">JOIN THE POOL</button>
      <p class="mnote">Everyone opens the <b>same</b> project folder. If you’ve been here before, you’ll rejoin your seat automatically. Chrome or Edge.</p>
      <p style="text-align:center;margin:10px 0 0"><button class="linkbtn" id="setuppool">create a new pool…</button></p>
    </div>
    <div id="slotwrap" style="display:none">
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="nick" placeholder="Your nick" maxlength="24">
        <button class="btn primary" id="joinfree">Join a seat</button>
      </div>
      <div class="slotgrid" id="slotgrid"></div>
    </div>
    <div id="modalfoot">
      <span>Folder: <b id="folderName">none</b></span>
      <button class="linkbtn" id="changefolder" style="display:none">Change folder</button>
    </div>
  </div>
</div>

<input type="file" id="fileImg" accept="image/*" multiple hidden>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
  var dpr=1, W=0, H=0;
  var SLOTS=20, TTL=45000;   // online window: a seat stays "online" this long after we last saw its heartbeat move

  var me = localStorage.getItem('lb_nick') || '';
  var mySlot = localStorage.getItem('lb_slot') || '';   // 'slot-03.json'
  document.getElementById('name').textContent = me || '—';

  function uid(){ return Date.now().toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36); }
  function pad2(n){ return ('0'+n).slice(-2); }
  function slotName(i){ return 'slot-'+pad2(i)+'.json'; }
  var ANIMALS=['Fox','Owl','Bear','Lynx','Otter','Wolf','Hare','Moose','Panda','Koala','Tiger','Whale','Eagle','Robin','Crane','Gecko','Bison','Heron','Dolphin','Falcon'];
  function seatAnimal(x){ var n=typeof x==='number'?x:slotNum(x); return ANIMALS[(n-1)%ANIMALS.length]||('Seat '+n); }
  function slotNum(fn){ var m=(fn||'').match(/(\d+)/); return m?+m[1]:0; }
  function hueColor(u){ u=u||'?'; var h=0; for(var i=0;i<u.length;i++) h=(h*31+u.charCodeAt(i))%360; return 'hsl('+h+' 65% 52%)'; }

  // ---- state ------------------------------------------------------------
  var mine=[];                 // objects of MY slot (authoritative in memory)
  var others={};               // fileName -> { nick, objects } (read-only)
  var slots={};                // fileName -> { slot, nick, seen, objects }
  var view={ s:1, tx:0, ty:0 };
  var tool='select', color='#111827', width=3, sel=null;
  var imgCache={}, undoStack=[];
  var dirHandle=null, assetsHandle=null, scanning=false;
  var observed={};             // fileName -> {seen, nick, at, live} — presence tracked on OUR clock
  var lastWrite={t:0,ok:true}, lastReadAt=0, DEBUG=false;
  var writeStart=0, scanStart=0, lastReadErr='';   // watchdog timers so a hung network call can't lock sync

  function allObjects(){ var out=mine.slice(); for(var fn in others) out=out.concat(others[fn].objects||[]); return out; }

  // ---- IndexedDB (remember folder handle + local crash cache) -----------
  var DB=null;
  function idbOpen(){ return new Promise(function(res){ try{ var r=indexedDB.open('localboard',1);
    r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); };
    r.onsuccess=function(){ DB=r.result; res(DB); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
  function idbGet(k){ return new Promise(function(res){ if(!DB) return res(null); try{ var t=DB.transaction('kv','readonly').objectStore('kv').get(k); t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
  function idbSet(k,v){ return new Promise(function(res){ if(!DB) return res(); try{ var t=DB.transaction('kv','readwrite').objectStore('kv').put(v,k); t.onsuccess=function(){ res(); }; t.onerror=function(){ res(); }; }catch(e){ res(); } }); }
  function saveLocal(){ idbSet('mine:'+(mySlot||'x'), mine); }

  function snapshot(){ undoStack.push(JSON.stringify(mine)); if(undoStack.length>60) undoStack.shift(); }
  function undo(){ if(!undoStack.length) return; mine=JSON.parse(undoStack.pop()); sel=null; commit(); }
  function commit(){ saveLocal(); scheduleWrite(); render(); }

  // ---- images as asset files -------------------------------------------
  function fileToImage(file){ return new Promise(function(res,rej){ var r=new FileReader();
    r.onload=function(){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
  function compress(img){ return new Promise(function(res){
    var max=1600, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    var w=Math.max(1,Math.round(img.naturalWidth*sc)), h=Math.max(1,Math.round(img.naturalHeight*sc));
    var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(function(b){ if(b){ res({blob:b,w:w,h:h,ext:'webp'}); }
      else c.toBlob(function(b2){ res({blob:b2,w:w,h:h,ext:'jpg'}); },'image/jpeg',0.85); },'image/webp',0.85);
  }); }
  function blobToDataURL(b){ return new Promise(function(res){ var r=new FileReader(); r.onload=function(){ res(r.result); }; r.readAsDataURL(b); }); }
  async function writeAsset(name, blob){ if(!assetsHandle) return;
    try{ var h=await assetsHandle.getFileHandle(name,{create:true}); var w=await h.createWritable(); await w.write(blob); await w.close(); }catch(e){ console.warn('asset write',e); } }
  async function loadAsset(name, im){ if(!assetsHandle) return;
    try{ var h=await assetsHandle.getFileHandle(name); var f=await h.getFile(); im.src=URL.createObjectURL(f); im.onload=render; }catch(e){} }
  function getImg(key){ if(!key) return new Image(); if(imgCache[key]) return imgCache[key];
    var im=new Image(); imgCache[key]=im;
    if(/^data:/.test(key)){ im.src=key; im.onload=render; } else { loadAsset(key, im); }
    return im; }
  function imgKey(o){ return o.asset||o.src; }

  async function addImageFile(file, atWorld){
    try{
      var img=await fileToImage(file), cmp=await compress(img);
      var id=uid(), c=atWorld||toWorld(W/2,H/2), max=340, sc=Math.min(1,max/Math.max(cmp.w,cmp.h)), w=cmp.w*sc, h=cmp.h*sc;
      var obj={ id:id, type:'image', x:c.x-w/2, y:c.y-h/2, w:w, h:h };
      var im=new Image(); im.src=URL.createObjectURL(cmp.blob); im.onload=render;
      if(assetsHandle){ var name=id+'.'+cmp.ext; obj.asset=name; imgCache[name]=im; writeAsset(name, cmp.blob); }
      else { obj.src=await blobToDataURL(cmp.blob); imgCache[obj.src]=im; }
      snapshot(); mine.push(obj); commit();
    }catch(e){ console.warn('image failed', e); }
  }

  // ---- shared folder ----------------------------------------------------
  var writeTimer=null, writing=false, writeAgain=false, lastGen='', lastBaseWrite=0;
  function scheduleWrite(){ if(!dirHandle||!mySlot) return; clearTimeout(writeTimer); writeTimer=setTimeout(writeMine, 500); }
  async function writeSlotFile(name, data){
    var h=await dirHandle.getFileHandle(name,{create:true}); var w=await h.createWritable();
    await w.write(new Blob([JSON.stringify(data)],{type:'application/json'})); await w.close();
  }
  // Delete this seat's generation files (except `keep`). Base slot file is never touched.
  async function sweepGens(baseFn, keep){
    try{ var pre=baseFn.replace(/\.json$/i,'')+'.';
      var del=[]; for await (var e of dirHandle.values()){
        if(e.kind==='file' && e.name!==baseFn && e.name!==keep && e.name.indexOf(pre)===0 && /\.json$/i.test(e.name)) del.push(e.name); }
      for(var i=0;i<del.length;i++){ try{ await dirHandle.removeEntry(del[i]); }catch(e){} }
    }catch(e){}
  }
  // seen must only ever increase for a seat, even across occupants with skewed
  // clocks — every outgoing write goes through nextSeen().
  var lastSeenOut=0;
  function nextSeen(){ lastSeenOut=Math.max(Date.now(), lastSeenOut+1); return lastSeenOut; }
  async function writeMine(){
    if(!dirHandle||!mySlot) return;
    if(writing && Date.now()-writeStart < 15000){ writeAgain=true; return; }   // only block briefly; recover if a write hung
    writing=true; writeStart=Date.now();
    try{
      var data={ slot:slotNum(mySlot), nick:me, seen:nextSeen(), objects:mine };
      // Each beat goes into a NEW generation file (slot-02.<ts>.json). The OS caches
      // file CONTENT per name, so a reader machine can be handed stale bytes forever
      // for a name it keeps re-reading — but never for a name it has never opened.
      var gen=mySlot.replace(/\.json$/i,'')+'.'+data.seen+'.json';
      await writeSlotFile(gen, data);
      var old=lastGen; lastGen=gen;
      if(old && old!==gen){ try{ await dirHandle.removeEntry(old); }catch(e){} }
      // Refresh the durable base file only occasionally — it's the archive copy.
      if(Date.now()-lastBaseWrite>10000){ await writeSlotFile(mySlot, data); lastBaseWrite=Date.now(); }
      lastWrite={t:Date.now(), ok:true};
    }catch(e){ lastWrite={t:Date.now(), ok:false, e:(e&&e.name)||'err'}; console.warn('write failed', e); }
    finally{ writing=false; updateDbg(); if(writeAgain){ writeAgain=false; writeMine(); } }
  }
  async function freeSeat(seat){   // keep drawings, clear presence so the seat frees now
    seat=seat||mySlot;   // capture: callers may reassign mySlot before our awaits run
    if(!dirHandle||!seat) return;
    // "free" is nick:'' with a FRESH seen — never seen:0, which readers would have
    // to special-case and a stale cached skeleton could then impersonate.
    try{ await writeSlotFile(seat, { slot:slotNum(seat), nick:'', seen:nextSeen(), objects:mine }); }catch(e){}
    lastGen=''; lastBaseWrite=0;
    await sweepGens(seat, null);
  }
  async function readAll(){
    var now=Date.now();   // slots is persistent: we merge good reads in, never wipe on a bad/stale one
    for await (var entry of dirHandle.values()){
      if(entry.kind!=='file') continue; var raw=entry.name, m=raw.match(/^slot-(\d+)(?:\.(\d+))?\.json$/i); if(!m) continue;
      var fn=slotName(+m[1]);   // base + generation files all merge into the canonical seat
      var rec;
      try{ var f=await entry.getFile(); var d=JSON.parse(await f.text());
        rec={ slot:+m[1], nick:d.nick||'', seen:d.seen||0, objects:Array.isArray(d.objects)?d.objects:[] };
      }catch(e){ continue; }   // partial / mid-write / just-deleted read: keep the last good copy
      var prev=slots[fn];
      // Purely monotonic: NOTHING older ever applies. This is what stops a stale
      // cached copy of the base file (e.g. the seen:0 skeleton) from wiping a seat
      // we already read fresher data for — the flash-then-vanish bug.
      if(prev && rec.seen < prev.seen) continue;
      slots[fn]=rec;
      // Optimistic presence on OUR clock: a claimed seat counts as online from the
      // moment we first read it, and stays online as long as we keep witnessing its
      // heartbeat (seen) move. It goes offline only after TTL with no movement.
      // Reader-side clocks only — immune to cross-machine clock skew.
      var po=observed[fn];

  async function syncNow(){

  // Create the assets folder + any missing seat files — WITHOUT ever overwriting
  // an existing one. Never trust the directory listing (a network share can serve
  // a stale listing that hides existing slots); check each file individually, and
  // even after a create, only write the skeleton if the file is truly empty.
  async function initPool(){
    try{ assetsHandle=await dirHandle.getDirectoryHandle('assets',{create:true}); }catch(e){ assetsHandle=null; }
    for(var i=1;i<=SLOTS;i++){
      try{
        var h;
        try{ h=await dirHandle.getFileHandle(slotName(i)); }               // exists → never touch it
        catch(nf){ h=await dirHandle.getFileHandle(slotName(i),{create:true}); }
        var f=await h.getFile();
        if(f.size>2) continue;                                            // has content → leave it alone

  async function afterFolder(){ homeView=false; updateProj(); await initPool(); await readAll(); if(await tryAutoRejoin()) return; renderPicker(); }

  async function tryAutoRejoin(){

      var rec=slots[fn];

      me=nick; await joinSlot(fn); return true;
    }catch(e){ return false; }
  }

  async function ensureFolder(){   // reuse remembered handle if still granted, else pick
    var h=await idbGet('dirHandle');
    if(h){ try{ var perm=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';
      if(perm!=='granted' && h.requestPermission) perm=await h.requestPermission({mode:'readwrite'});

  // Always shows the OS folder picker. Join mode (default) expects an existing

  // ---- join / seat ------------------------------------------------------
  function isLive(fn){ if(fn===mySlot) return true; var o=observed[fn];

  function firstFree(){ for(var i=1;i<=SLOTS;i++){ var fn=slotName(i); if(!isLive(fn) || fn===mySlot) return fn; } return null; }

  async function joinSlot(fn){

    // Re-read the slot file fresh at the moment of joining, so we never adopt a
    // stale-empty cached copy and then write it back over the seat's real history.
    // Take whichever is newest: the fresh base-file read or the merged view
    // (which includes generation files).
    var best=slots[fn]||null;

    mine = JSON.parse(JSON.stringify(best ? (best.objects||[]) : []));

    // never ignored by readers even if our clock runs behind theirs.
    lastSeenOut=Math.max(lastSeenOut, (best&&best.seen)||0);
    sweepGens(fn, null);   // clear a previous occupant's leftover generation files
    mine.forEach(function(o){ if(o.type==='image') getImg(imgKey(o)); });

    var o={}; for(var k in slots){ if(k!==fn) o[k]={ nick:slots[k].nick, objects:slots[k].objects }; } others=o;

  }
  function tryJoin(fn){

  // Closing is explicit only (the ✕, shown once you have a seat) — a misclick on

      html+='<div class="pw'+(mineSeat?' me':'')+'"><span class="sw" style="background:'+hueColor(nick)+';opacity:'+(live?1:.4)+'"></span>'+seatAnimal(fn)+' · '+nick+(mineSeat?' (you)':(live?'':' · idle'))+'</div>'; });

  // ---- view / coords ----------------------------------------------------
  function resize(){ dpr=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight;

  // ---- render -----------------------------------------------------------
  var cur=null;

    ctx.save(); ctx.translate(view.tx,view.ty); ctx.scale(view.s,view.s);

    objs.forEach(function(o){ if(o.type==='image'){ var im=getImg(imgKey(o)); if(im.complete&&im.naturalWidth) ctx.drawImage(im,o.x,o.y,o.w,o.h); } });

  }
  function drawNote(o){
    var hidden=(noteEdObj===o);   // the textarea covers it while editing

    ctx.beginPath(); ctx.roundRect(o.x+3,o.y+4,o.w,o.h,6); ctx.fill();   // cheap drop shadow
    ctx.fillStyle=o.color||'#FEF08A';
    ctx.beginPath(); ctx.roundRect(o.x,o.y,o.w,o.h,6); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=1/view.s; ctx.stroke();
    if(o.text && !hidden){
      ctx.beginPath(); ctx.rect(o.x+8,o.y+8,o.w-16,o.h-(o.author?32:16)); ctx.clip();
      ctx.fillStyle='#1f2937'; ctx.font='13px ui-sans-serif,system-ui,sans-serif'; ctx.textBaseline='top';
      var lh=17, ty=o.y+10, maxW=o.w-20;

      ctx.fillStyle=hueColor(o.author);
      ctx.beginPath(); ctx.roundRect(o.x+10,o.y+o.h-18,8,8,2); ctx.fill();
      ctx.fillStyle='rgba(31,41,55,.6)'; ctx.font='10px ui-sans-serif,system-ui,sans-serif'; ctx.textBaseline='top';

  }
  function drawStroke(o){ if(!o.pts.length) return; ctx.save(); ctx.strokeStyle=displayColor(o.color); ctx.lineWidth=o.width; ctx.lineCap='round'; ctx.lineJoin='round';

  // ---- hit testing (mine only) -----------------------------------------
  function hitHandle(o,w){ if(!isBoxObj(o)) return false; var hs=10/view.s; return Math.abs(w.x-(o.x+o.w))<hs && Math.abs(w.y-(o.y+o.h))<hs; }
  function hitList(w,list){ for(var i=list.length-1;i>=0;i--){ var o=list[i];

      else { var tol=Math.max(8/view.s,o.width/2+4/view.s); for(var j=0;j<o.pts.length-1;j++){ if(segDist(w,o.pts[j],o.pts[j+1])<tol) return o; }

  // ---- pointer ----------------------------------------------------------

    if(tool==='pen'){ if(!mySlot){ openSeatPicker(); return; } mode='draw'; cur={id:uid(),type:'stroke',color:color,width:width,pts:[[w.x,w.y]]}; return; }
    if(tool==='note'){ if(!mySlot){ openSeatPicker(); return; }
      var note={ id:uid(), type:'note', x:w.x-85, y:w.y-60, w:170, h:120, text:'', color:STICKY[stickyIdx++%STICKY.length], author:me };
      snapshot(); mine.push(note); commit(); setTool('select'); sel=note; render(); openNoteEditor(note); return; }

  // ---- sticky note editor ----------------------------------------------
  var STICKY=['#FEF08A','#FECACA','#BBF7D0','#BFDBFE','#F5D0FE'], stickyIdx=0;

    t.value=o.text||''; t.spellcheck=false; t.placeholder='Type…';
    styleNoteEd(); document.body.appendChild(t); t.focus();
    t.addEventListener('blur', function(){ closeNoteEditor(true); });
    t.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ e.preventDefault(); closeNoteEditor(true); }
      e.stopPropagation();   // keep board shortcuts (Delete, V/P/N…) out of typing
    });
    render();
  }
  function styleNoteEd(){
    if(!noteEd||!noteEdObj) return; var o=noteEdObj;
    noteEd.style.cssText='position:fixed;z-index:40;box-sizing:border-box;resize:none;outline:none;'+
      'left:'+(o.x*view.s+view.tx)+'px;top:'+(o.y*view.s+view.ty)+'px;'+
      'width:'+(o.w*view.s)+'px;height:'+(o.h*view.s)+'px;'+
      'background:'+(o.color||'#FEF08A')+';color:#1f2937;'+
      'border:1.5px solid rgba(0,0,0,.2);border-radius:'+(6*view.s)+'px;'+
      'padding:'+(10*view.s)+'px '+(10*view.s)+'px '+(26*view.s)+'px;font:'+(13*view.s)+'px/'+(17*view.s)+'px ui-sans-serif,system-ui,sans-serif;'+
      'box-shadow:0 8px 20px rgba(16,24,40,.22)';
  }
  function closeNoteEditor(commitIt){
    if(!noteEd) return;
    var t=noteEd, o=noteEdObj; noteEd=null; noteEdObj=null;
    if(commitIt && o){ var v=t.value; if(v!==(o.text||'')){ snapshot(); o.text=v; commit(); } }
    t.remove(); render();
  }
  canvas.addEventListener('wheel', function(e){ e.preventDefault(); var s=evPos(e); var factor=e.deltaY<0?1.1:1/1.1;
    var ns=Math.min(8,Math.max(0.05,view.s*factor)); factor=ns/view.s; view.tx=s.x-(s.x-view.tx)*factor; view.ty=s.y-(s.y-view.ty)*factor; view.s=ns; render(); }, {passive:false});

  // ---- images: drop / paste / button -----------------------------------
  ['dragenter','dragover'].forEach(function(t){ window.addEventListener(t,function(e){ e.preventDefault(); }); });
  window.addEventListener('drop', function(e){ e.preventDefault(); if(!mySlot){ openSeatPicker(); return; }
    var s=evPos(e), w=toWorld(s.x,s.y), files=e.dataTransfer.files, off=0;
    for(var i=0;i<files.length;i++){ if(/^image\//.test(files[i].type)){ addImageFile(files[i],{x:w.x+off,y:w.y+off}); off+=24; } } });
  window.addEventListener('paste', function(e){ if(!mySlot) return; var items=e.clipboardData&&e.clipboardData.items; if(!items) return;
    for(var i=0;i<items.length;i++){ if(items[i].type.indexOf('image')===0){ var f=items[i].getAsFile(); if(f) addImageFile(f,null); } } });

  function fit(){ var objs=allObjects(); if(!objs.length){ view={s:1,tx:0,ty:0}; render(); return; }
    var b=bboxOf(objs[0]), minx=b.x,miny=b.y,maxx=b.x+b.w,maxy=b.y+b.h;
    objs.forEach(function(o){ var bb=bboxOf(o); minx=Math.min(minx,bb.x); miny=Math.min(miny,bb.y); maxx=Math.max(maxx,bb.x+bb.w); maxy=Math.max(maxy,bb.y+bb.h); });
    var pad=60, bw=Math.max(1,maxx-minx), bh=Math.max(1,maxy-miny); var s=Math.max(0.05,Math.min((W-2*pad)/bw,(H-2*pad)/bh,4));
    view.s=s; view.tx=W/2-(minx+bw/2)*s; view.ty=H/2-(miny+bh/2)*s; render(); }

  // ---- toolbar ----------------------------------------------------------
  function setTool(t){ tool=t; if(t!=='select') sel=null;
    [].forEach.call(document.querySelectorAll('[data-tool]'),function(b){ b.classList.toggle('on',b.dataset.tool===t); });
    canvas.style.cursor=t==='pen'?'crosshair':(t==='pan'?'grab':'default'); render(); }
  [].forEach.call(document.querySelectorAll('[data-tool]'),function(b){ b.addEventListener('click',function(){ setTool(b.dataset.tool); }); });

  // ---- theme ------------------------------------------------------------
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>';
  var theme=localStorage.getItem('lb_theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  function applyTheme(){ document.documentElement.setAttribute('data-theme',theme);
    document.getElementById('themebtn').innerHTML=(theme==='dark')?SUN:MOON; render(); }
  document.getElementById('themebtn').addEventListener('click', function(){
    theme=(theme==='dark')?'light':'dark'; localStorage.setItem('lb_theme',theme); applyTheme(); });
  // Near-black ink is unreadable on the dark surface — brighten it at draw time
  // only; the stored object keeps its true colour for everyone else.
  function displayColor(c){ if(theme!=='dark') return c; var m=/^#([0-9a-f]{6})$/i.exec(c||''); if(!m) return c;
    var n=parseInt(m[1],16), r=n>>16, g=(n>>8)&255, b=n&255;
    return (0.2126*r+0.7152*g+0.0722*b)<60 ? '#e5e7eb' : c; }
  applyTheme();

  // ---- home (project select) & project name ------------------------------
  var homeView=false;
  function openHome(){ homeView=true; openSeatPicker(); }
  function updateProj(){ var p=document.getElementById('proj'), n=dirHandle?(dirHandle.name||''):'';
    p.textContent=n; p.style.display=n?'inline':'none'; document.title=n?(n+' — Local Board'):'Local Board'; }
  document.getElementById('color').addEventListener('input',function(e){ color=e.target.value; });
  document.getElementById('width').addEventListener('input',function(e){ width=+e.target.value; });
  document.getElementById('addImg').addEventListener('click',function(){ if(!mySlot){ openSeatPicker(); return; } document.getElementById('fileImg').click(); });
  document.getElementById('fileImg').addEventListener('change',function(e){ [].forEach.call(e.target.files,function(f){ if(/^image\//.test(f.type)) addImageFile(f,null); }); e.target.value=''; });
  document.getElementById('del').addEventListener('click',delSel);
  document.getElementById('dup').addEventListener('click',copySel);
  document.getElementById('undo').addEventListener('click',undo);
  document.getElementById('fit').addEventListener('click',fit);
  document.getElementById('homebtn').addEventListener('click', openHome);
  document.getElementById('chanchip').addEventListener('click', openSeatPicker);
  function delSel(){ if(sel && selOwned()){ snapshot(); mine.splice(mine.indexOf(sel),1); sel=null; commit(); } }
  function copySel(){
    if(!sel || !mySlot) return;
    var c=JSON.parse(JSON.stringify(sel)); c.id=uid();
    var off=16/view.s;
    if(isBoxObj(c)){ c.x+=off; c.y+=off; } else { c.pts=c.pts.map(function(p){ return [p[0]+off,p[1]+off]; }); }
    if(c.type==='note') c.author=me;   // your copy carries your signature
    snapshot(); mine.push(c); sel=c; commit();
  }

  // ---- keyboard ---------------------------------------------------------
  window.addEventListener('keydown',function(e){
    if(e.code==='Space'){ spaceDown=true; if(mode!=='draw') canvas.style.cursor='grab'; }
    if(e.target.tagName==='INPUT') return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
    else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='d'||e.key.toLowerCase()==='c')){ if(sel){ e.preventDefault(); copySel(); } }
    else if(e.key==='Delete'||e.key==='Backspace'){ if(sel){ e.preventDefault(); delSel(); } }
    else if(e.key==='v'||e.key==='V'){ setTool('select'); }
    else if(e.key==='p'||e.key==='P'){ setTool('pen'); }
    else if(e.key==='n'||e.key==='N'){ setTool('note'); }
    else if(e.key==='h'||e.key==='H'){ setTool('pan'); }
  });
  window.addEventListener('keyup',function(e){ if(e.code==='Space'){ spaceDown=false; if(tool!=='pan') canvas.style.cursor='default'; } });
  window.addEventListener('resize',resize);
  window.addEventListener('pagehide', function(){ if(window._lbBeat){ clearInterval(window._lbBeat); window._lbBeat=null; } freeSeat(); });

  // ---- boot -------------------------------------------------------------
  (async function(){
    await idbOpen(); resize(); updatePeers();
    try{
      var h=await idbGet('dirHandle');
      if(h){ var perm=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';
        if(perm==='granted'){ dirHandle=h; updateProj(); try{ await initPool(); await readAll(); }catch(e){}
          if(await tryAutoRejoin()) return; } }   // returning user: straight onto the board
    }catch(e){}
    openSeatPicker();
  })();
})();
</script>
</body>
</html>
